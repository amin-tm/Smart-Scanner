[package]
name = "smart-scanner"
version = "2.0.0"
description = "Smart Scanner - fast document scanner and PDF maker"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

# Tiny native binary: the UI is rendered by the WebView2 that ships with Windows 10/11.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
